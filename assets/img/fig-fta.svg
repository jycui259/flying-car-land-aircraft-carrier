<text x="930.0" y="274.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="9.6" fill="#2b343d" font-weight="400" text-anchor="middle">空间定向障碍/误操作</text>
<rect x="844.0" y="294.0" width="172.0" height="24.0" rx="6" fill="#fff" stroke="#d9d2c4" stroke-width="1" opacity="1"/>
<text x="930.0" y="310.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="9.6" fill="#2b343d" font-weight="400" text-anchor="middle">阵风/下洗超限</text>
<rect x="844.0" y="330.0" width="172.0" height="24.0" rx="6" fill="#fff" stroke="#d9d2c4" stroke-width="1" opacity="1"/>
