<rect x="30.0" y="418.0" width="500.0" height="190.0" rx="10" fill="#fffdf6" stroke="#eddfc2" stroke-width="1" opacity="1"/>
<text x="48.0" y="444.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="11" fill="#a9701f" font-weight="700" text-anchor="start">最小割集（示例，按公开构型推断）</text>
<text x="48.0" y="470.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="10.4" fill="#2b343d" font-weight="400" text-anchor="start">① 同侧两路推进失效 + 电涵道偏航不可用</text>
<text x="48.0" y="494.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="10.4" fill="#2b343d" font-weight="400" text-anchor="start">② 飞控单点失效未被隔离（违反 X3.1331(c)）</text>
<text x="48.0" y="518.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="10.4" fill="#2b343d" font-weight="400" text-anchor="start">③ 电池热失控 → 高压失效 → 迫降/起火</text>
<text x="48.0" y="542.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="10.4" fill="#2b343d" font-weight="400" text-anchor="start">④ 折叠锁定空中解锁（违反 X3.612）</text>
<text x="48.0" y="566.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="10.4" fill="#2b343d" font-weight="400" text-anchor="start">⑤ 飞行员空间定向障碍 + 无自动改出</text>
<text x="560.0" y="444.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="11" fill="#a9701f" font-weight="700" text-anchor="start">为何用“不可控坠落”作顶事件？</text>
<text x="560.0" y="470.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="10.4" fill="#2b343d" font-weight="400" text-anchor="start">专用条件把“可控应急着陆”定义为顶层安全目标：</text>
<text x="560.0" y="492.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="10.4" fill="#2b343d" font-weight="400" text-anchor="start">允许机体损坏，但必须保护乘员免受严重伤害。</text>
<text x="560.0" y="520.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="10.4" fill="#2b343d" font-weight="400" text-anchor="start">因此顶事件不是“任何故障”，而是“丧失可控</text>
<text x="560.0" y="542.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="10.4" fill="#2b343d" font-weight="400" text-anchor="start">应急着陆能力”，与审定语言保持一致。</text>
<text x="560.0" y="574.0" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif" font-size="9.6" fill="#5f6d7a" font-weight="400" text-anchor="start">定量结果见正文表 9-3（假设值，仅数量级）。</text>
</svg>
